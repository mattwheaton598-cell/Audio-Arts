let tasks=JSON.parse(localStorage.getItem('audioArtsTasksV5')||'null')||seed;tasks=tasks.map(t=>t.id==='s1'&&!t.unlock?{...t,unlock:'2026-10-02'}:t);let filter='all',mode='active',editing=null;const names={podcast:'Podcasting',sound:'Sound Design',freelance:'Freelance Producing'},codes={podcast:'BCST 3259 · Thursday',sound:'BCST 1256 · Tuesday',freelance:'BCST 1281 · Monday'};
function persist(){localStorage.setItem('audioArtsTasksV5',JSON.stringify(tasks))}function stats(){const el=document.getElementById('stats');el.innerHTML=['freelance','sound','podcast'].map(c=>`<div class="card ${filter===c?'active':''}" onclick="toggleFilter('${c}')"><div><b>${names[c]}</b><div class="meta">${codes[c]}</div></div><div class="count">${tasks.filter(t=>t.cls===c&&t.status==='active').length} <span class="meta" style="font-size:12px">active</span></div></div>`).join('')}
function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}function daysUntil(date){if(!date)return null;const now=dayStart(new Date()),due=dayStart(new Date(date+'T12:00:00'));return Math.ceil((due-now)/86400000)}function isLocked(t){return !!(t.unlock&&daysUntil(t.unlock)>0)}function unlockText(t){const d=daysUntil(t.unlock);if(d===1)return '🔒 UNLOCKS TOMORROW';if(d===0)return '🔓 UNLOCKS TODAY';return d>1?'🔒 UNLOCKS IN '+d+' DAYS':''}function countdownText(t){const d=daysUntil(t.due);if(d===null)return '';if(d<0)return Math.abs(d)+' day'+(Math.abs(d)===1?'':'s')+' overdue';if(d===0)return 'DUE TODAY';if(d===1)return 'DUE TOMORROW';return 'DUE IN '+d+' DAYS'}function renderUrgent(){const upcoming=tasks.filter(t=>t.status==='active'&&t.due).map(t=>[t,daysUntil(t.due)]).filter(x=>x[1]>=0&&x[1]<=7).sort((a,b)=>a[1]-b[1]);const panel=document.getElementById('urgentPanel');panel.innerHTML=`<div class="urgentHead" onclick="toggleUrgent()"><div><div class="eyebrow">Plan ahead</div><div class="urgentTitle">⚡ DUE NEXT WEEK</div></div><div class="urgentBadge">${upcoming.length} UPCOMING ▾</div></div><div class="urgentBody" id="urgentBody">${upcoming.length?upcoming.map(([t,d])=>`<div class="urgentItem" onclick="editTask('${t.id}')"><div><div class="course">${names[t.cls]}</div><b>${esc(t.name)}</b><div class="meta">${esc(t.dueText||formatDue(t))}</div></div><div class="countdown ${isLocked(t)?'locked':(d<=2?'now':'')}">${isLocked(t)?unlockText(t):countdownText(t)}</div></div>`).join(''):'<div class="empty">Nothing due in the next 7 days.</div>'}</div>`}function toggleUrgent(){const b=document.getElementById('urgentBody');b.classList.toggle('collapsed')}function render(){stats();renderUrgent();let a=tasks.filter(t=>(filter==='all'||t.cls===filter)&&t.status===mode);a.sort((x,y)=>(x.due||'9999').localeCompare(y.due||'9999'));document.getElementById('heading').textContent=mode==='active'?'Active assignments':'Completed assignments';document.getElementById('list').innerHTML=a.length?a.map(t=>`<article class="task ${isLocked(t)?'lockedTask':''}"><div class="stripe ${t.cls}"></div><div class="main"><div><span class="course">${names[t.cls]}</span>${t.review?'<span class="pill review">REVIEW</span>':''}${isLocked(t)?'<span class="pill locked">🔒 LOCKED</span>':''}${t.status==='done'?'<span class="pill done">COMPLETED</span>':''}</div><div class="name">${esc(t.name)}</div>${isLocked(t)?`<div class="lockNote">${unlockText(t)}</div>`:''}<div class="due ${t.due&&t.due<='2026-10-03'&&t.status==='active'?'urgent':''}">${esc(t.dueText||formatDue(t))}</div><div class="details">${esc(t.details||'')}</div><div class="meta" style="margin-top:7px">Source: ${esc(t.source||'Manual entry')}</div></div><div class="actions"><button class="icon" title="Edit" onclick="editTask('${t.id}')">✎</button>${t.status==='active'?`<button class="icon" title="Complete" onclick="complete('${t.id}')">✓</button>`:''}</div></article>`).join(''):'<div class="empty">Nothing here.</div>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function formatDue(t){return t.due?'Due '+t.due+(t.time?' · '+t.time:''):'Deadline not entered'}function toggleFilter(c){filter=filter===c?'all':c;render()}function resetFilter(){filter='all';mode='active';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.mode==='active'));render()}function setMode(m,b){mode=m;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}function complete(id){let t=tasks.find(x=>x.id===id);t.status='done';persist();render()}
function openAdd(){editing=null;document.getElementById('modalTitle').textContent='Add assignment';fill({cls:'podcast',status:'active',source:'Manual entry'});show()}function editTask(id){editing=id;let t=tasks.find(x=>x.id===id);document.getElementById('modalTitle').textContent='Edit assignment';fill(t);show()}function fill(t){fClass.value=t.cls||'podcast';fStatus.value=t.status||'active';fName.value=t.name||'';fUnlock.value=t.unlock||'';fDue.value=t.due||'';fTime.value=t.time||'';fDueText.value=t.dueText||'';fDetails.value=t.details||'';fSource.value=t.source||'Manual entry';sourceWrap.innerHTML=t.sourceImg?`<div class="meta">Original screenshot</div><img class="sourceImg" src="${t.sourceImg}">`:''}function show(){editModal.classList.add('show')}function closeModal(){editModal.classList.remove('show')}function saveEdit(){let obj={id:editing||('m'+Date.now()),cls:fClass.value,status:fStatus.value,name:fName.value.trim()||'Untitled assignment',unlock:fUnlock.value,due:fDue.value,time:fTime.value,dueText:fDueText.value.trim(),details:fDetails.value.trim(),source:fSource.value,review:false};if(editing){let old=tasks.find(x=>x.id===editing);obj.sourceImg=old.sourceImg;tasks[tasks.findIndex(x=>x.id===editing)]=obj}else tasks.push(obj);persist();closeModal();render()}editModal.addEventListener('click',e=>{if(e.target===editModal)closeModal()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
